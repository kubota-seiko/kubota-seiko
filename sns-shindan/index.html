<style>
:root{--ink:#1A1A1A;--sub:#666;--faint:#8C8C8C;--line:#ECECEC;--soft:#F7F8F5;--gold:#B8924F;--gold-l:#F4EFE5;}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.9;font-feature-settings:"palt";-webkit-font-smoothing:antialiased;}
.wrap{max-width:720px;margin:0 auto;padding:0 22px;}
header.site{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);}
.nav{max-width:960px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;}
.brand{text-decoration:none;color:var(--ink);font-weight:700;font-size:15px;letter-spacing:.03em;}
.brand span{color:var(--sub);font-weight:400;font-size:12px;margin-left:8px;}
.nav a.back{font-size:13px;color:var(--sub);text-decoration:none;}
.hero{background:linear-gradient(180deg,#fff,var(--soft));padding:52px 0 30px;text-align:center;}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin:0 0 12px;}
h1{font-size:clamp(24px,4.4vw,34px);line-height:1.4;font-weight:800;margin:0 0 14px;}
.lead{font-size:15.5px;color:var(--sub);line-height:2.0;max-width:600px;margin:0 auto;}
section{padding:8px 0 60px;}
.sh-form{max-width:560px;margin:14px auto 0;text-align:left;}
.sh-form label{display:block;font-size:13.5px;font-weight:700;margin:16px 0 6px;}
.sh-form .hint{font-weight:400;color:var(--faint);font-size:12px;margin-left:6px;}
.sh-form input,.sh-form textarea,.sh-form select{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink);}
.sh-form textarea{resize:vertical;}
.sh-form .req{color:var(--gold);font-size:11px;margin-left:6px;}
.sh-btn{display:block;width:100%;margin-top:20px;background:var(--gold);color:#fff;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;}
.sh-btn:hover{opacity:.92;}
.sh-mini{color:var(--faint);font-size:12.5px;margin:10px 2px 0;line-height:1.8;}
.sh-loading{max-width:560px;margin:24px auto 0;color:var(--sub);font-size:14px;text-align:center;}
.sh-result{max-width:640px;margin:26px auto 0;text-align:left;}
.sh-result-msg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;font-size:14px;line-height:1.9;}
.sh-card{border:1px solid var(--line);border-radius:14px;background:#fff;padding:26px 24px;}
.sh-card .sh-eyebrow{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:700;margin:0 0 6px;}
.sh-card h3{font-size:20px;font-weight:800;margin:0 0 6px;}
.sh-url{color:var(--sub);font-size:13px;margin:0 0 18px;}
.sh-lead-block{background:var(--soft);border-radius:10px;padding:14px 16px;margin:0 0 18px;font-size:14px;line-height:1.85;}
.sh-finding{border-top:1px solid var(--line);padding:16px 0;}
.sh-finding:last-child{padding-bottom:2px;}
.sh-finding h4{font-size:15.5px;font-weight:700;margin:0 0 8px;}
.sh-row{font-size:13.5px;line-height:1.8;margin:4px 0;}
.sh-row b{color:var(--gold);font-weight:700;}
.sh-cta-row{margin-top:22px;text-align:center;}
.sh-cta-row .sh-pdf{display:inline-block;background:#fff;border:1px solid var(--gold);color:var(--gold);font-weight:700;border-radius:10px;padding:12px 22px;font-size:14px;cursor:pointer;font-family:inherit;margin:6px;}
.sh-cta-row .sh-line{display:inline-block;background:var(--gold);color:#fff;font-weight:700;border-radius:10px;padding:12px 22px;font-size:14px;text-decoration:none;margin:6px;}
footer.site{background:var(--soft);border-top:1px solid var(--line);padding:30px 0;text-align:center;}
footer.site a{color:var(--sub);text-decoration:none;font-size:13px;margin:0 10px;}
footer.site .cp{font-size:12px;color:var(--faint);margin-top:12px;}
</style>
</head>
<body>
<header class="site">
  <div class="nav">
    <a href="/" class="brand">窪田成功<span>思考整理の参謀</span></a>
    <a href="/" class="back">← トップへ戻る</a>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <p class="eyebrow">SNS Free Check</p>
    <h1>SNS導線診断</h1>
    <p class="lead">Instagram・X・Facebook・noteのプロフィールと投稿を貼り付けると、AIが「誰に・何の人かが一瞬で伝わるか」「次の行動へ導けているか」「発信の軸」を診断します。結果はその場で表示され、PDFで保存して持ち帰れます。</p>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="sh-form">
      <label>SNSの種類 <span class="hint">任意</span></label>
      <select id="snsPlatform">
        <option value="">選んでください</option>
        <option>Instagram</option>
        <option>X（Twitter）</option>
        <option>Facebook</option>
        <option>note</option>
        <option>その他</option>
      </select>

      <label>プロフィール文<span class="req">必須</span> <span class="hint">アカウントの自己紹介欄をそのままコピペ</span></label>
      <textarea id="snsProfile" rows="4" placeholder="例：〇〇県で美容室を経営／30代女性の髪の悩みに寄り添う／…"></textarea>

      <label>最近の投稿を2〜3個 <span class="hint">投稿の本文を貼り付け（あると精度が上がります）</span></label>
      <textarea id="snsPosts" rows="6" placeholder="投稿1：…&#10;&#10;投稿2：…&#10;&#10;投稿3：…"></textarea>

      <label>発信の主な目的 <span class="hint">任意</span></label>
      <select id="snsPurpose">
        <option value="">選んでください</option>
        <option>集客したい</option>
        <option>認知を広げたい</option>
        <option>リクルート（採用）</option>
        <option>発信を整理したい</option>
        <option>その他</option>
      </select>

      <label>今いちばん感じている悩み <span class="hint">任意</span></label>
      <textarea id="snsNote" rows="2" placeholder="例：投稿しても反応が薄い／何を発信すればいいか分からない など"></textarea>

      <button id="snsRun" type="button" class="sh-btn">診断する</button>
      <p class="sh-mini">※無料。結果はその場で表示・PDFで保存できます。貼り付けた内容は診断のためだけに使われます。</p>
    </div>
    <div id="snsResult" class="sh-result" hidden></div>
  </div>
</section>

<footer class="site">
  <div class="wrap">
    <a href="/">トップ</a>・<a href="/#hp-shindan">ホームページ導線診断</a>・<a href="https://lin.ee/Qr9byp1" target="_blank" rel="noopener">LINEで相談</a>
    <div class="cp">© Eternal株式会社</div>
  </div>
</footer>

<script>
(function(){
  var runBtn=document.getElementById('snsRun');
  if(!runBtn)return;
  var resultEl=document.getElementById('snsResult');
  var pdfLoaded=false;
  function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
  function esc(t){var d=document.createElement('div');d.textContent=(t==null?'':t);return d.innerHTML;}
  function track(ev,params){if(window.gtag){try{window.gtag('event',ev,params||{});}catch(e){}}}
  function isCanvasBlank(c){try{var x=c.getContext('2d');var w=c.width,h=c.height;if(!w||!h)return true;var d=x.getImageData(0,0,w,h).data;var nw=0;for(var i=0;i<d.length;i+=4){if(!(d[i]>248&&d[i+1]>248&&d[i+2]>248)){nw++;if(nw>200)return false;}}return true;}catch(e){return false;}}
  function printFallback(el,title){var w=window.open('','_blank');if(!w){alert('PDFとして保存するには、ブラウザのポップアップを許可してください。');return;}var css='body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1A1A1A;line-height:1.9;padding:28px;max-width:720px;margin:0 auto;}h3{font-size:20px;margin:0 0 8px;}.sh-eyebrow{color:#B8924F;font-weight:700;letter-spacing:.18em;font-size:11px;margin:0 0 6px;}.sh-url{color:#666;font-size:13px;margin:0 0 16px;word-break:break-all;}.sh-lead-block{background:#F7F8F5;border-radius:10px;padding:14px 16px;margin:0 0 16px;font-size:14px;}.sh-finding{border-top:1px solid #eee;padding:14px 0;}.sh-finding h4{font-size:15px;margin:0 0 8px;}.sh-row{font-size:13.5px;margin:4px 0;}.sh-row b{color:#B8924F;}.sh-mini{color:#8C8C8C;font-size:12px;margin-top:14px;}';w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+title+'</title><style>'+css+'</style></head><body>'+el.outerHTML+'<scr'+'ipt>window.onload=function(){setTimeout(function(){try{window.focus();}catch(e){}window.print();},350);};<\/scr'+'ipt></body></html>');w.document.close();}
  function exportPdf(){
    var el=document.getElementById('snsReportCard'); if(!el)return; track('sns_shindan_pdf_save',{});
    var TITLE='SNS導線診断書';
    var run=function(){
      var sy=window.pageYOffset||0;
      var fonts=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
      fonts.catch(function(){}).then(function(){window.scrollTo(0,0);return new Promise(function(r){setTimeout(r,80);});})
      .then(function(){return html2canvas(el,{scale:1,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0});})
      .then(function(c){
        if(isCanvasBlank(c)){window.scrollTo(0,sy);printFallback(el,TITLE);return;}
        return html2pdf().set({margin:[10,8],filename:TITLE+'.pdf',image:{type:'jpeg',quality:0.95},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0,windowWidth:document.documentElement.clientWidth},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(el).save().then(function(){window.scrollTo(0,sy);});
      }).catch(function(){window.scrollTo(0,sy);printFallback(el,TITLE);});
    };
    if(window.html2pdf&&window.html2canvas){run();return;}
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js').then(function(){run();}).catch(function(){alert('PDFの生成に失敗しました。時間をおいて再度お試しください。');});
  }
  function ctaRow(withPdf){
    return '<div class="sh-cta-row">'+
      (withPdf?'<a class="sh-pdf" id="snsPdf" role="button">PDFで保存する</a>':'')+
      '<a class="sh-line" href="https://lin.ee/Qr9byp1" target="_blank" rel="noopener" data-cta-label="sns_shindan_result_line">'+(withPdf?'この診断をもとに相談する（LINE）→':'SNSの導線を相談する（LINE）→')+'</a>'+
    '</div>';
  }
  function renderReport(data){
    var f=data.findings.map(function(x){return '<div class="sh-finding"><h4>'+esc(x.t)+'</h4>'+
      '<p class="sh-row"><b>現状：</b>'+esc(x.now)+'</p>'+
      '<p class="sh-row"><b>影響：</b>'+esc(x.eff)+'</p>'+
      '<p class="sh-row"><b>改善：</b>'+esc(x.fix)+'</p></div>';}).join('');
    var html='<div class="sh-card" id="snsReportCard">'+
      '<p class="sh-eyebrow">SNS 導線診断書</p>'+
      '<h3>SNS導線診断書</h3>'+
      (data.platform?'<p class="sh-url">対象：'+esc(data.platform)+'</p>':'')+
      '<div class="sh-lead-block">'+esc(data.summary)+'</div>'+f+
      '<p class="sh-mini" style="text-align:left;margin-top:16px;">※本診断はAIによる自動診断です。SNSからの着地先（HP・LP）まで含めた導線の整理は、個別相談で承ります。</p>'+
    '</div>'+ctaRow(true);
    resultEl.innerHTML=html;resultEl.hidden=false;
    document.getElementById('snsPdf').addEventListener('click',exportPdf);
    resultEl.scrollIntoView({behavior:'smooth',block:'start'});
  }
  function renderMessage(msg){
    resultEl.innerHTML='<div class="sh-result-msg">'+esc(msg)+'</div>'+ctaRow(false);
    resultEl.hidden=false;resultEl.scrollIntoView({behavior:'smooth',block:'start'});
  }
  runBtn.addEventListener('click',function(){
    var profile=(document.getElementById('snsProfile').value||'').trim();
    var posts=(document.getElementById('snsPosts').value||'').trim();
    if(profile.length<8 && posts.length<8){document.getElementById('snsProfile').focus();renderMessage('プロフィール文か投稿を、もう少し貼り付けてください（数行あれば診断できます）。');return;}
    var payload={
      platform:(document.getElementById('snsPlatform').value||''),
      profile:profile, posts:posts,
      purpose:(document.getElementById('snsPurpose').value||''),
      note:(document.getElementById('snsNote').value||'').trim()
    };
    resultEl.hidden=false;resultEl.innerHTML='<div class="sh-loading">発信内容を読み解いています…（20秒ほどかかる場合があります）</div>';
    runBtn.disabled=true;runBtn.textContent='診断中…';
    track('sns_shindan_run',{platform:payload.platform});
    fetch('/api/sns-shindan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.ok&&d.findings&&d.findings.length){renderReport(d);track('sns_shindan_success',{platform:payload.platform});}
        else{renderMessage((d&&d.message)||'うまく診断できませんでした。個別診断をご利用ください。');track('sns_shindan_error',{});}
      })
      .catch(function(){renderMessage('通信に問題が発生しました。時間をおいて再度お試しください。');})
      .then(function(){runBtn.disabled=false;runBtn.textContent='診断する';});
  });
})();
</script>
</body>
</html>
